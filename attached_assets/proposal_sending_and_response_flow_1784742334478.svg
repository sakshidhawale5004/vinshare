<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 380"><title fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Sending the proposal and tracking client response</title><desc fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Flowchart showing the proposal being sent by email and WhatsApp, the client review stage with a 24 hour reminder, and the branch into approved or rejected and stalled.</desc>
<defs/>

<g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">
<rect x="230" y="40" width="220" height="56" rx="8" stroke-width="0.5px" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>
<text x="340" y="58" text-anchor="middle" fill="rgb(8, 80, 65)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="500">Send proposal</text>
<text x="340" y="78" text-anchor="middle" fill="rgb(15, 110, 86)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="400">Email + WhatsApp</text>
</g>
<line x1="340" y1="96" x2="340" y2="156" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>

<g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">
