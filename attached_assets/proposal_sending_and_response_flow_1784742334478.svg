<line x1="340" y1="212" x2="340" y2="250" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>
<line x1="340" y1="250" x2="220" y2="280" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>
<line x1="340" y1="250" x2="460" y2="280" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>
<text x="245" y="245" text-anchor="end" fill="rgb(82, 81, 78)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="400">Approved</text>
<text x="435" y="245" text-anchor="start" fill="rgb(82, 81, 78)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="400">No reply</text>

<g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">
<rect x="120" y="280" width="200" height="56" rx="8" stroke-width="0.5px" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>
<text x="220" y="298" text-anchor="middle" fill="rgb(39, 80, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="500">Proposal approved</text>
<text x="220" y="318" text-anchor="middle" fill="rgb(59, 109, 17)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="400">Moves to detailing</text>
</g>

<g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">
<rect x="360" y="280" width="200" height="56" rx="8" stroke-width="0.5px" fill="rgb(252, 235, 235)" stroke="rgb(163, 45, 45)" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start"/>
<text x="460" y="298" text-anchor="middle" fill="rgb(121, 31, 31)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="500">Rejected or stalled</text>
<text x="460" y="318" text-anchor="middle" fill="rgb(163, 45, 45)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="400">Ops follows up manually</text>
</g>
