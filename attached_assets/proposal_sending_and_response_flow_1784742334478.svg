<text x="340" y="194" text-anchor="middle" fill="rgb(133, 79, 11)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="400">Awaiting decision</text>
</g>
