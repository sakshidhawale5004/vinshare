<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 484"><title fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">From approval to invoice generation</title><desc fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Flowchart showing the approved proposal moving into manual detailing, invoice authorization by finance, and automatic invoice generation from a template.</desc>
